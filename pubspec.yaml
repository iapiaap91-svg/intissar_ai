name: intissar_ai
description: "Intissar AI - Edge AI Recording & Multilingual Transcription App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  record: ^5.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  path: ^1.9.0
  ffi: ^2.1.2
  whisper_ggml_plus: ^1.5.2
  pdf: ^3.10.8
  printing: ^5.13.1
  intl: ^0.19.0
  syncfusion_flutter_pdf: ^27.1.58
  archive: ^3.6.1
  xml: ^6.5.0
  http: ^1.2.2
  flutter_tesseract_ocr: ^0.4.24
  arabic_reshaper: ^0.0.1
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  sqlite3: ^2.4.0
  sqlcipher_flutter_libs: ^0.6.8
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/fonts/
    - tessdata/
