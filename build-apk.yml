name: Build Offline Android APK

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    name: Build APK (Capacitor + Vosk offline)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (Capacitor)
        run: npx cap add android

      - name: Bundle offline assets (JS libs + Tesseract data + Vosk models)
        run: node scripts/bundle-offline-assets.js

      - name: Patch native Android project (Vosk plugin)
        run: node scripts/patch-native-android.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: intissar-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach APK to Release (only on tagged release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
