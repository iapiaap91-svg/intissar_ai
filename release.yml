name: Build & Publish Desktop Releases

# يعمل الأكشن تلقائياً عند إنشاء ونشر Release جديد على GitHub
on:
  release:
    types: [published]

# إعطاء صلاحيات الكتابة لرفق الحزم المصدرة داخل صفحة الـ Release
permissions:
  contents: write

jobs:
  # =======================================================
  # 1. بناء وحزم نسخة Windows (Exe Installer) + توقيع رقمي اختياري
  # =======================================================
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      # يولّد مجلد windows/ تلقائياً داخل الـ CI نفسه — لا حاجة لتشغيل هذا
      # الأمر محلياً قبل الدفع (push)؛ آمن التكرار (idempotent) إن كان
      # المجلد موجوداً بالفعل.
      - name: Generate windows/ platform folder
        run: flutter create --platforms=windows .

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Windows Application
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile Inno Setup Script
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      # --- التوقيع الرقمي (اختياري): يعمل فقط إذا أُضيفت الأسرار التالية
      # في Settings -> Secrets and variables -> Actions:
      #   WIN_CERTIFICATE_BASE64  (شهادة .pfx مُحوَّلة إلى Base64)
      #   WIN_CERT_PASSWORD       (كلمة مرور الشهادة)
      # إن لم تُضَف، تُتخطى هذه الخطوات تلقائياً دون فشل البناء.
      - name: Decode Windows Certificate
        if: ${{ secrets.WIN_CERTIFICATE_BASE64 != '' }}
        shell: powershell
        run: |
          $certBytes = [System.Convert]::FromBase64String("${{ secrets.WIN_CERTIFICATE_BASE64 }}")
          [System.IO.File]::WriteAllBytes("$env:TEMP\certificate.pfx", $certBytes)

      - name: Sign Windows Installer Executable
        if: ${{ secrets.WIN_CERTIFICATE_BASE64 != '' }}
        shell: powershell
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Select-Object -First 1).FullName
          & $signtool sign /f "$env:TEMP\certificate.pfx" /p "${{ secrets.WIN_CERT_PASSWORD }}" /tr http://timestamp.digicert.com /td sha256 /fd sha256 "InstallerOutput\IntissarAI_Windows_Setup_v1.0.exe"

      - name: Cleanup Temporary Certificate
        if: always()
        shell: powershell
        run: |
          Remove-Item -Path "$env:TEMP\certificate.pfx" -Force -ErrorAction SilentlyContinue

      - name: Upload Windows Installer to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: InstallerOutput/IntissarAI_Windows_Setup_v1.0.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =======================================================
  # 2. بناء وحزم نسخة Linux: AppImage محمول + أرشيف .tar.gz احتياطي
  # =======================================================
  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libalsa-dev libglu1-mesa libssl-dev

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      # يولّد مجلد linux/ تلقائياً داخل الـ CI نفسه — لا حاجة لتشغيل هذا
      # الأمر محلياً قبل الدفع (push).
      - name: Generate linux/ platform folder
        run: flutter create --platforms=linux .

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Linux Application
        run: flutter build linux --release

      - name: Compress Linux Bundle Directory (.tar.gz)
        run: |
          cd build/linux/x64/release/bundle
          tar -czvf ../../../../../IntissarAI-Linux-x64.tar.gz *

      # --- بناء AppImage (اختياري لكن موصى به لدعم التحديث الآلي داخل
      # التطبيق عبر AutoUpdaterService) — يتطلب appimagetool، يُنزَّل هنا
      # مباشرة من إصداراته الرسمية على GitHub.
      - name: Download appimagetool
        run: |
          wget -q -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/
          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/intissar_ai" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/intissar_ai.desktop << 'EOF'
          [Desktop Entry]
          Name=Intissar AI
          Exec=intissar_ai
          Icon=intissar_ai
          Type=Application
          Categories=Utility;
          EOF
          # أيقونة مؤقتة إن لم تتوفر أيقونة .png مخصصة في المشروع
          if [ -f assets/icon.png ]; then
            cp assets/icon.png AppDir/intissar_ai.png
          else
            echo "⚠️ لا توجد assets/icon.png — سيُستخدم AppImage بدون أيقونة مخصّصة."
          fi

      - name: Build AppImage
        run: |
          # --appimage-extract-and-run: يتفادى الاعتماد على FUSE، وهو غير
          # متوفر افتراضياً على عمّال (runners) GitHub Actions.
          ./appimagetool --appimage-extract-and-run AppDir IntissarAI-x86_64.AppImage || echo "⚠️ فشل بناء AppImage — راجع سجلّ الأخطاء أعلاه."

      - name: Upload Linux Packages to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            IntissarAI-Linux-x64.tar.gz
            IntissarAI-x86_64.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =======================================================
  # 3. بناء وحزم نسخة Android (APK) — لضمان بقاء الموبايل وسطح المكتب
  #    يُبنيان معاً مع كل إصدار (Release) جديد.
  # =======================================================
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      # يولّد مجلد android/ تلقائياً داخل الـ CI نفسه.
      - name: Generate android/ platform folder
        run: flutter create --platforms=android .

      # إضافة الأذونات المطلوبة (ميكروفون، تخزين، خدمة أمامية) إلى
      # AndroidManifest.xml المُولَّد تلقائياً — مرة واحدة فقط إن لم تكن
      # موجودة مسبقاً (آمن التكرار).
      - name: Add required permissions to AndroidManifest.xml
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
            sed -i '/<manifest /a\
              <uses-permission android:name="android.permission.RECORD_AUDIO" />\
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Install Flutter Dependencies
        run: flutter pub get

      # ملاحظة صريحة: هذا البناء يستخدم توقيع debug الافتراضي لـ Flutter
      # (لا توجد شهادة توقيع Release مُعدَّة بعد) — صالح للتجربة والتوزيع
      # المباشر (side-load)، لكن غير كافٍ للرفع على Google Play، الذي
      # يتطلب توقيعاً بمفتاح Release حقيقي (keystore خاص بك).
      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
